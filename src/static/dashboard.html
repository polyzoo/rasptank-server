<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaspTank Control Center</title>
    <script src="/static/chart.js"></script>
    <script>
        if (!window.Chart) {
            document.write('<script src="chart.js"><\/script>');
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #F4F6F8;
            --bg-card: #FFFFFF;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --text-tertiary: #9CA3AF;
            --accent: #10B981;
            --accent-hover: #059669;
            --accent-soft: #ECFDF5;
            --danger: #EF4444;
            --danger-soft: #FEF2F2;
            --border: #E5E7EB;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        /* ----- HEADERS ----- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #34D399, #10B981);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.25rem;
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.2);
        }

        .title h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .title p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-top: 0.2rem;
        }

        /* ----- CARDS ----- */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card-header {
            padding: 1.5rem 2rem 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #F3F4F6;
            color: var(--text-secondary);
        }
        .badge.active { background: var(--accent-soft); color: var(--accent); }

        /* ----- LAYOUTS ----- */
        .control-panel {
            display: grid;
            grid-template-columns: 360px 1fr;
            min-height: 400px;
        }

        .inputs-section {
            padding: 2rem;
            border-right: 1px solid var(--border);
            background: #FAFAFA;
            display: flex;
            flex-direction: column;
        }

        .math-section {
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1.5rem;
            overflow-x: auto;
        }

        /* ----- INPUTS & BUTTONS ----- */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap input {
            width: 100%;
            height: 44px;
            padding: 0 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: white;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            color: var(--text-primary);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .input-wrap input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        .input-wrap .unit {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 0.8rem;
            pointer-events: none;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-group {
            margin-top: auto;
            padding-top: 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn {
            height: 44px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary { background: var(--accent); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }
        .btn-danger { background: white; color: var(--danger); border: 1px solid var(--danger-soft); }
        .btn-danger:hover { background: var(--danger-soft); }

        /* ----- MATH EQUATION BEAUTIFICATION ----- */
        .equation-box {
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            gap: 1.5rem;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }

        .matrix-wrap {
            position: relative;
            padding: 0.5rem 1rem;
        }

        /* Beautiful thin brackets */
        .matrix-wrap::before, .matrix-wrap::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            width: 10px;
            border: 1.5px solid #D1D5DB;
            border-radius: 6px;
        }
        .matrix-wrap::before { left: 0; border-right: none; border-top-right-radius: 0; border-bottom-right-radius: 0; }
        .matrix-wrap::after { right: 0; border-left: none; border-top-left-radius: 0; border-bottom-left-radius: 0; }

        .matrix-wrap.active-vector {
            background: #F9FAFB;
            border-radius: 8px;
        }
        .matrix-wrap.active-vector::before, .matrix-wrap.active-vector::after { border-color: var(--accent); }

        .matrix {
            display: grid;
            gap: 0.75rem 1.5rem;
            text-align: center;
        }
        .matrix-5x5 { grid-template-columns: repeat(5, 1fr); }
        .matrix-5x2 { grid-template-columns: repeat(2, 1fr); }
        .matrix-2x5 { grid-template-columns: repeat(5, 1fr); }
        .vector { grid-template-columns: 1fr; }

        .state-space-box {
            width: 100%;
            justify-content: center;
            font-size: 0.95rem;
        }

        .formula-label {
            color: var(--text-primary);
            font-weight: 600;
        }

        .math-val { color: var(--text-primary); font-weight: 500; }
        
        .live-val {
            color: var(--accent);
            font-weight: 600;
            transition: color 0.15s, transform 0.15s;
            display: inline-block;
        }
        .live-val.ping { color: var(--text-primary); transform: scale(1.1); }
        .operator { color: var(--text-tertiary); font-weight: 300; font-size: 1.5rem; }

        /* ----- CHARTS ----- */
        .charts-wrapper {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .chart-card {
            padding-bottom: 1.5rem;
        }

        .chart-area {
            height: 250px;
            width: 100%;
            padding: 0 1rem;
            margin-top: 1rem;
        }

        @media (max-width: 1200px) {
            .control-panel { grid-template-columns: 1fr; }
            .inputs-section { border-right: none; border-bottom: 1px solid var(--border); }
            .charts-wrapper { grid-template-columns: 1fr; }
            .math-section { padding: 2rem 1rem; justify-content: flex-start; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">
            <div class="logo">RT</div>
            <div class="title">
                <h1>RaspTank Dashboard</h1>
            </div>
        </div>
        <div id="masterStatus" class="badge">Сервер Ожидает</div>
    </div>

    <!-- MAIN CONTROL PANEL -->
    <div class="card control-panel">
        <div class="inputs-section">
            <div class="form-group">
                <label>Номинальная линейная скорость</label>
                <div class="input-wrap">
                    <input type="number" id="v0Param" step="0.1" value="18.0">
                    <span class="unit">см/с</span>
                </div>
            </div>

            <div class="form-group">
                <label>Желаемая линейная скорость</label>
                <div class="input-wrap">
                    <input type="number" id="vDesParam" step="0.1" value="18.0">
                    <span class="unit">см/с</span>
                </div>
            </div>

            <div class="form-group">
                <label>Желаемая угловая скорость</label>
                <div class="input-wrap">
                    <input type="number" id="omega0Param" step="0.1" value="0.0">
                    <span class="unit">°/с</span>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label>Линейная инерция</label>
                    <div class="input-wrap">
                        <input type="number" id="tvParam" min="0.01" step="0.01" value="0.80">
                        <span class="unit">с</span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Угловая инерция</label>
                    <div class="input-wrap">
                        <input type="number" id="twParam" min="0.01" step="0.01" value="0.55">
                        <span class="unit">с</span>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button id="startMotion" class="btn btn-primary">Запустить двигатели</button>
                <button id="stopMotion" class="btn btn-danger">Стоп</button>
            </div>
        </div>

        <div class="math-section">
            <div class="equation-box">
                <!-- dX/dt -->
                <div class="matrix-wrap">
                    <div class="matrix vector">
                        <span>ẋ</span><span>ẏ</span><span>θ̇</span><span>v̇</span><span>ω̇</span>
                    </div>
                </div>
                
                <span class="operator">=</span>
                
                <!-- Matrix A -->
                <div class="matrix-wrap">
                    <div class="matrix matrix-5x5 math-val">
                        <span>0</span><span>0</span><span>0</span><span>1</span><span>0</span>
                        <span>0</span><span>0</span><span id="f-v0" class="live-val">18.0</span><span>0</span><span>0</span>
                        <span>0</span><span>0</span><span>0</span><span>0</span><span>1</span>
                        <span>0</span><span>0</span><span>0</span><span id="f-tv" class="live-val">-1.25</span><span>0</span>
                        <span>0</span><span>0</span><span>0</span><span>0</span><span id="f-tw" class="live-val">-1.82</span>
                    </div>
                </div>
                
                <!-- Vector X (Live) -->
                <div class="matrix-wrap active-vector">
                    <div class="matrix vector">
                        <span id="live-x" class="live-val">0.00</span>
                        <span id="live-y" class="live-val">0.00</span>
                        <span id="live-theta" class="live-val">0.00</span>
                        <span id="live-v" class="live-val">0.00</span>
                        <span id="live-omega" class="live-val">0.00</span>
                    </div>
                </div>

                <span class="operator">+</span>
                
                <!-- Matrix B -->
                <div class="matrix-wrap">
                    <div class="matrix matrix-5x2 math-val">
                        <span>0</span><span>0</span>
                        <span>0</span><span>0</span>
                        <span>0</span><span>0</span>
                        <span id="f-btv" class="live-val">1.25</span><span>0</span>
                        <span>0</span><span id="f-btw" class="live-val">1.82</span>
                    </div>
                </div>

                <!-- Vector U -->
                <div class="matrix-wrap">
                    <div class="matrix vector">
                        <span id="f-vdes" class="live-val">18.0</span>
                        <span id="f-omegades" class="live-val">0.0</span>
                    </div>
                </div>
            </div>

            <div class="equation-box state-space-box">
                <span class="formula-label">u</span>
                <span class="operator">=</span>
                <span class="operator">-</span>

                <div class="matrix-wrap">
                    <div class="matrix matrix-2x5 math-val">
                        <span id="k00" class="live-val">—</span><span id="k01" class="live-val">—</span><span id="k02" class="live-val">—</span><span id="k03" class="live-val">—</span><span id="k04" class="live-val">—</span>
                        <span id="k10" class="live-val">—</span><span id="k11" class="live-val">—</span><span id="k12" class="live-val">—</span><span id="k13" class="live-val">—</span><span id="k14" class="live-val">—</span>
                    </div>
                </div>

                <div class="matrix-wrap active-vector">
                    <div class="matrix vector">
                        <span id="err-x" class="live-val">0.00</span>
                        <span id="err-y" class="live-val">0.00</span>
                        <span id="err-theta" class="live-val">0.00</span>
                        <span id="err-v" class="live-val">0.00</span>
                        <span id="err-omega" class="live-val">0.00</span>
                    </div>
                </div>

                <span class="operator">=</span>

                <div class="matrix-wrap">
                    <div class="matrix vector">
                        <span id="u-v" class="live-val">0.00</span>
                        <span id="u-omega" class="live-val">0.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- CHARTS -->
    <div class="charts-wrapper">
        <div class="card chart-card">
            <div class="card-header">
                <span class="card-title">IMU Датчики</span>
                <span id="badge-l1" class="badge">Отключено</span>
            </div>
            <div class="chart-area"><canvas id="chartL1"></canvas></div>
        </div>

        <div class="card chart-card">
            <div class="card-header">
                <span class="card-title">Кинематика</span>
                <span id="badge-l2" class="badge">Отключено</span>
            </div>
            <div class="chart-area"><canvas id="chartL2"></canvas></div>
        </div>

        <div class="card chart-card">
            <div class="card-header">
                <span class="card-title">Профилирование</span>
                <span id="badge-l3" class="badge">Отключено</span>
            </div>
            <div class="chart-area"><canvas id="chartL3"></canvas></div>
        </div>
    </div>
</div>

<script>
    const MAX_POINTS = 50;
    let chartL1, chartL2, chartL3;

    function fmt(val, dec = 2) { return Number(val).toFixed(dec); }

    // Synchronize Form Inputs with Math Formula
    function updateFormula() {
        const v0 = parseFloat(document.getElementById('v0Param').value) || 0;
        const vDes = parseFloat(document.getElementById('vDesParam').value) || 0;
        const omegaDes = parseFloat(document.getElementById('omega0Param').value) || 0;
        const tv = Math.max(parseFloat(document.getElementById('tvParam').value) || 1, 0.01);
        const tw = Math.max(parseFloat(document.getElementById('twParam').value) || 1, 0.01);
        
        document.getElementById('f-v0').textContent = fmt(v0, 1);
        document.getElementById('f-tv').textContent = fmt(-1/tv, 2);
        document.getElementById('f-tw').textContent = fmt(-1/tw, 2);
        document.getElementById('f-btv').textContent = fmt(1/tv, 2);
        document.getElementById('f-btw').textContent = fmt(1/tw, 2);
        document.getElementById('f-vdes').textContent = fmt(vDes, 1);
        document.getElementById('f-omegades').textContent = fmt(omegaDes, 1);
    }

    ['v0Param', 'vDesParam', 'omega0Param', 'tvParam', 'twParam'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateFormula);
    });

    // Create Beautiful Gradients for Charts
    function createGradient(ctx, colorBase) {
        const gradient = ctx.createLinearGradient(0, 0, 0, 250);
        gradient.addColorStop(0, colorBase.replace('1)', '0.2)'));
        gradient.addColorStop(1, colorBase.replace('1)', '0)'));
        return gradient;
    }

    function setupCharts() {
        if (!window.Chart) return;

        Chart.defaults.color = '#9CA3AF';
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.plugins.legend.position = 'bottom';
        Chart.defaults.plugins.legend.labels.usePointStyle = true;
        Chart.defaults.plugins.legend.labels.boxWidth = 6;
        Chart.defaults.plugins.tooltip.mode = 'index';
        Chart.defaults.plugins.tooltip.intersect = false;
        Chart.defaults.elements.point.radius = 0;
        Chart.defaults.elements.point.hoverRadius = 4;
        Chart.defaults.elements.line.borderWidth = 2.5;
        Chart.defaults.elements.line.tension = 0.4; // Smooth curves!

        const gridOpts = { color: '#F3F4F6', drawBorder: false };
        const xOpts = { display: false };

        const ctxL1 = document.getElementById('chartL1').getContext('2d');
        chartL1 = new Chart(ctxL1, {
            type: 'line',
            data: { datasets: [
                { label: 'Ускорение X', yAxisID: 'y', borderColor: 'rgba(16, 185, 129, 1)', backgroundColor: createGradient(ctxL1, 'rgba(16, 185, 129, 1)'), fill: true, data: [] },
                { label: 'Ускорение Y', yAxisID: 'y', borderColor: 'rgba(59, 130, 246, 1)', data: [] },
                { label: 'Гироскоп Z', yAxisID: 'y1', borderColor: 'rgba(245, 158, 11, 1)', borderDash: [5,5], data: [] }
            ]},
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    x: xOpts,
                    y: { position: 'left', grid: gridOpts },
                    y1: { position: 'right', grid: {drawOnChartArea: false} }
                }
            }
        });

        const ctxL2 = document.getElementById('chartL2').getContext('2d');
        chartL2 = new Chart(ctxL2, {
            type: 'line',
            data: { datasets: [
                { label: 'Скорость', yAxisID: 'y', borderColor: 'rgba(16, 185, 129, 1)', backgroundColor: createGradient(ctxL2, 'rgba(16, 185, 129, 1)'), fill: true, data: [] },
                { label: 'Левый мотор', yAxisID: 'y1', borderColor: 'rgba(139, 92, 246, 1)', data: [] },
                { label: 'Правый мотор', yAxisID: 'y1', borderColor: 'rgba(236, 72, 153, 1)', data: [] }
            ]},
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    x: xOpts,
                    y: { position: 'left', grid: gridOpts },
                    y1: { position: 'right', grid: {drawOnChartArea: false}, min: -100, max: 100 }
                }
            }
        });

        const ctxL3 = document.getElementById('chartL3').getContext('2d');
        chartL3 = new Chart(ctxL3, {
            type: 'line',
            data: { datasets: [
                { label: 'Текущая', yAxisID: 'y', borderColor: 'rgba(16, 185, 129, 1)', data: [] },
                { label: 'Целевая', yAxisID: 'y', borderColor: 'rgba(156, 163, 175, 1)', borderDash: [4,4], data: [] },
                { label: 'Дистанция', yAxisID: 'y1', borderColor: 'rgba(239, 68, 68, 1)', backgroundColor: createGradient(ctxL3, 'rgba(239, 68, 68, 1)'), fill: true, data: [] }
            ]},
            options: {
                responsive: true, maintainAspectRatio: false, animation: false,
                scales: {
                    x: xOpts,
                    y: { position: 'left', grid: gridOpts },
                    y1: { position: 'right', grid: {drawOnChartArea: false} }
                }
            }
        });
    }

    function pushData(chart, idx, val) {
        if(!chart) return;
        const numericValue = Number(val);
        if (!Number.isFinite(numericValue)) return;
        const ds = chart.data.datasets[idx];
        ds.data.push(numericValue);
        if (idx === 0) chart.data.labels.push('');
        if(ds.data.length > MAX_POINTS) ds.data.shift();
        if(chart.data.labels.length > MAX_POINTS) chart.data.labels.shift();
    }

    function updateLiveVector(data) {
        const ids = ['live-x', 'live-y', 'live-theta', 'live-v', 'live-omega'];
        const vals = [ data.x_cm, data.y_cm, data.heading_deg, data.linear_speed_cm_per_sec, data.angular_speed_deg_per_sec ];
        ids.forEach((id, i) => {
            const el = document.getElementById(id);
            el.textContent = fmt(vals[i] || 0);
            el.classList.add('ping');
            setTimeout(() => el.classList.remove('ping'), 100);
        });
    }

    function updateStateSpaceFormula(data) {
        const k = data.state_space_gain_k;
        if (Array.isArray(k)) {
            k.forEach((row, rowIdx) => {
                row.forEach((value, colIdx) => {
                    const el = document.getElementById(`k${rowIdx}${colIdx}`);
                    if (el) el.textContent = fmt(value, 2);
                });
            });
        }

        const errorIds = ['err-x', 'err-y', 'err-theta', 'err-v', 'err-omega'];
        const errorState = data.state_space_error_x;
        if (Array.isArray(errorState)) {
            errorIds.forEach((id, i) => {
                const el = document.getElementById(id);
                if (el) el.textContent = fmt(errorState[i], 2);
            });
        }

        const controlU = data.state_space_control_u;
        if (Array.isArray(controlU)) {
            document.getElementById('u-v').textContent = fmt(controlU[0], 2);
            document.getElementById('u-omega').textContent = fmt(controlU[1], 2);
        }
    }

    function setMasterStatus(text, isActive) {
        const el = document.getElementById('masterStatus');
        el.textContent = text;
        if(isActive) el.classList.add('active'); else el.classList.remove('active');
    }

    function connectWS(path, onData, badgeId) {
        const host = window.location.host || 'localhost:8000';
        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${proto}//${host}${path}`);
        const badge = document.getElementById(badgeId);

        ws.onopen = () => { badge.textContent = 'В сети'; badge.classList.add('active'); };
        ws.onclose = () => { badge.textContent = 'Отключено'; badge.classList.remove('active'); setTimeout(() => connectWS(path, onData, badgeId), 3000); };
        ws.onmessage = (e) => onData(JSON.parse(e.data));
    }

    document.getElementById('startMotion').onclick = async () => {
        const vDes = parseFloat(document.getElementById('vDesParam').value) || 0;
        const omegaDes = parseFloat(document.getElementById('omega0Param').value) || 0;
        const tv = parseFloat(document.getElementById('tvParam').value) || 0.8;
        const tw = parseFloat(document.getElementById('twParam').value) || 0.55;

        setMasterStatus('В движении', true);

        await fetch(`http://${window.location.host || 'localhost:8000'}/v1/l2/reset-state`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({})
        });

        // Включаем и настраиваем МПС
        await fetch(`http://${window.location.host || 'localhost:8000'}/v1/l2/config-state-space`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({enabled: true, t_v: tv, t_w: tw})
        });

        // Отправляем команду
        fetch(`http://${window.location.host || 'localhost:8000'}/v1/l2/cmd-vel`, {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({linear_speed_cm_per_sec: vDes, angular_speed_deg_per_sec: omegaDes})
        });
    };

    document.getElementById('stopMotion').onclick = () => {
        setMasterStatus('Остановлено', false);
        fetch(`http://${window.location.host || 'localhost:8000'}/v1/l2/stop`, { method: 'POST' });
    };

    setupCharts();
    updateFormula();

    connectWS('/v1/l1/ws', d => {
        pushData(chartL1, 0, d.accel_x_m_s2); pushData(chartL1, 1, d.accel_y_m_s2); pushData(chartL1, 2, d.angular_speed_z_deg_per_sec);
        chartL1.update();
    }, 'badge-l1');

    connectWS('/v1/l2/ws', d => {
        pushData(chartL2, 0, d.linear_speed_cm_per_sec); pushData(chartL2, 1, d.left_percent); pushData(chartL2, 2, d.right_percent);
        chartL2.update(); updateLiveVector(d); updateStateSpaceFormula(d);
    }, 'badge-l2');

    connectWS('/v1/l3/ws', d => {
        pushData(chartL3, 0, d.linear_speed_cm_per_sec); pushData(chartL3, 1, d.desired_linear_speed_cm_per_sec); pushData(chartL3, 2, d.distance_error_cm);
        chartL3.update();
    }, 'badge-l3');

</script>
</body>
</html>
